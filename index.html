<style>
/* VOICE: calmo, encorajador, direto — caderneta de campo de recenseador
   IDEA: a prancheta do recenseador: folha de coleta com itens a marcar
   PICTURE: cabeçalho verde com curvas de nível + contagem regressiva grande
   COLOUR and TYPE: verde-campo dominante, branco, amarelo-sol de destaque; Barlow / Barlow Condensed
   LAYOUT: app de celular, uma coluna, barra de abas embaixo */
:root{color-scheme:light dark;
--bg:light-dark(#f3f3f4,#0d0d0e);--card:light-dark(#ffffff,#18181a);--ink:light-dark(#18181b,#ececee);
--mut:light-dark(#62626a,#9d9da6);--line:light-dark(#e4e4e7,#2a2a2e);
--g:#f26a1b;--g2:light-dark(color-mix(in srgb,var(--g) 11%,#fff),color-mix(in srgb,var(--g) 22%,#18181a));--sun:var(--g);--rest:light-dark(#ececef,#26262a);
--pt:#2f6fd0;--mt:#d9622b;--ct:#1d8a52;--qs:#6b4fbf;--rv:#8a7a3a;--fx:#c0392b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{background:var(--g);color:#fff;position:relative;overflow:hidden;padding:calc(env(safe-area-inset-top) + 18px) 0 22px}
.top svg.topo{position:absolute;inset:0;width:100%;height:100%;opacity:.18;pointer-events:none}
.top .wrap{position:relative}
.top small{display:block;opacity:.85;font-size:14px}
.top h1{font-size:clamp(32px,8vw,46px);margin-top:4px}
.back{background:none;border:0;color:#fff;opacity:.9;padding:8px 0;min-height:44px;font-weight:600}
.count{display:flex;align-items:flex-end;gap:14px;margin-top:14px;flex-wrap:wrap}
.count b{font:700 clamp(54px,16vw,84px)/.9 "Barlow Condensed",sans-serif;color:var(--sun)}
.count span{font-size:15px;opacity:.95;padding-bottom:6px}
.bar{height:10px;background:rgba(255,255,255,.22);border-radius:6px;overflow:hidden;margin-top:14px;display:flex}
.bar i{display:block;height:100%;transition:width .4s}
main.wrap{padding-top:18px;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--card);z-index:28}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:24px;margin-bottom:10px}
.muted{color:var(--mut);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--g);color:#fff;font-weight:600}
.btn.alt{background:var(--g2);color:var(--ink)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pick{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;min-height:44px}
.pick .av{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--g);color:#fff;font:700 26px "Barlow Condensed";margin-right:14px;vertical-align:middle}
.pick .av img,.top .foto img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.pick .av{overflow:hidden}
.foto{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid var(--sun);color:var(--sun);font:700 30px "Barlow Condensed";overflow:hidden;padding:0;cursor:pointer;flex:none}
.who{display:flex;align-items:center;gap:14px;margin-top:4px}
.fotobtn{margin-right:14px;background:none;border:0;color:#fff;opacity:.85;font-size:14px;font-weight:600;text-decoration:underline;padding:6px 0;min-height:32px}
.pick strong{font-size:22px;font-family:"Barlow Condensed";vertical-align:middle}
.conc h3{font-size:26px}
.conc .meta{margin:4px 0 12px}
.mini{height:8px;background:var(--g2);border-radius:5px;overflow:hidden;display:flex}
.mini i{display:block;height:100%;background:var(--c,var(--g))}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.chk{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--mut);background:transparent;display:grid;place-items:center;margin-top:1px;padding:0}
.chk svg{width:18px;height:18px;opacity:0}
.task.ok .chk{background:var(--g);border-color:var(--g)}
.task.ok .chk svg{opacity:1}
.task.ok .tt{text-decoration:line-through;color:var(--mut)}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border-radius:6px;padding:2px 8px;margin:0 4px 3px 0}
.tag.late{background:transparent;color:var(--fx);border:1px solid var(--fx)}
.tt{display:block;font-weight:500}
.hint{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.day{margin-bottom:12px}
.day h3{font-size:20px;display:flex;justify-content:space-between;gap:8px}
.day.hoje{border-color:var(--g);box-shadow:0 0 0 2px var(--g) inset}
.day.off{opacity:.6}
.wk{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.wk h2{font-size:22px;margin:0;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--g2);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:700;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:12px;font-weight:700;color:var(--mut);text-align:center;padding:4px 0}
.cal button{aspect-ratio:1/1.05;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-weight:700;font-size:15px}
.cal button.fora{visibility:hidden}
.cal button.hoje{border:2px solid var(--g)}
.cal button.sel{background:var(--g);color:#fff;border-color:var(--g)}
.cal button.prova{background:var(--fx);color:#fff;border-color:var(--fx)}
.cal button.feito .n::after{content:"✓";font-size:11px;margin-left:2px;color:var(--ct)}
.cal button.sel.feito .n::after{color:#fff}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.dots i.ok{opacity:.35}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--mut)}
.leg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}
.donut{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.donut .fig{position:relative;width:150px;height:150px}
.donut svg{width:150px;height:150px;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .c b{font:700 38px/1 "Barlow Condensed"}
.donut .c span{font-size:13px;color:var(--mut)}
.lg{display:grid;gap:10px}
.lg div{font-size:14px}
.lg b{display:flex;justify-content:space-between;gap:8px;font-weight:600}
@media(max-width:420px){.donut{grid-template-columns:1fr;justify-items:center}.lg{width:100%}}
.subj h3{font-size:22px;display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:0}
dt{color:var(--mut);font-size:14px;padding-top:2px}dd{margin:0;font-weight:600}
.dist{display:grid;gap:8px;margin-top:6px}
.dist div{display:grid;grid-template-columns:9.5em minmax(0,1fr) 2.5em;gap:10px;align-items:center;font-size:14px}
.dist i{display:block;height:14px;border-radius:4px;background:var(--c)}
.dist b{text-align:right}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.tl li:first-child{border-top:0}
.tl li b{white-space:nowrap}
.tl li.past{color:var(--mut)}
.tl li.big b,.tl li.big span{color:var(--fx);font-weight:700}
ul.dots-list{margin:0;padding-left:20px}
ul.dots-list li{margin:4px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-width:52px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700}
.chip[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}
label.f{display:block;margin-bottom:12px;font-size:14px;color:var(--mut)}
label.f input,label.f textarea{display:block;width:100%;margin-top:4px;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
textarea{min-height:90px}
.pausa{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:max(4px,calc(env(safe-area-inset-bottom) - 14px));z-index:5}
.tabs .wrap{display:grid}
.tabs button{background:none;border:0;min-height:52px;font-size:13px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current=true]{color:var(--g)}

.alert{background:light-dark(#fff6d6,#3a3012);border:1px solid light-dark(#f0d77a,#6b5a1f);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
a{color:inherit}
.foot{text-align:center;font-size:12px;color:var(--mut);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.wrap.wide{max-width:1000px}
.grp{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--mut);margin:14px 0 2px}
.grp:first-of-type{margin-top:4px}
.grp svg{width:18px;height:18px;flex:none}
.sub{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.mini-btn{text-decoration:none;display:inline-flex;align-items:center;min-height:34px;padding:0 10px;margin-top:6px;margin-right:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600;color:var(--ink)}
.mini-btn.ok{border-color:var(--ct);color:var(--ct)}
.plf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:14px}
.plf input{width:64px;font-size:16px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.fire{display:flex;align-items:center;gap:14px}
.fire svg{width:46px;height:46px;flex:none}
.fire b{font:700 34px/1 "Barlow Condensed"}
.fire .muted{display:block;margin-top:2px}
.prev{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.prev svg{width:22px;height:22px;flex:none;margin-top:1px}
.adi{width:100%;margin-top:6px;flex-direction:column;gap:0;padding:8px 18px;min-height:52px}
.adi small{font-weight:500;opacity:.85;font-size:13px}
.stepper{display:grid;grid-template-columns:4.5em 44px 2.2em 44px minmax(0,1fr);align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.stepper:first-of-type{border-top:0}
.stepper b{text-align:center;font:700 20px "Barlow Condensed"}
.stepper button{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:20px}
.stepper span.muted{font-size:13px}
.pdfbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pdfbar .pg{font-weight:700;font-size:16px}
.pdfwrap{overflow:auto;border-radius:10px;background:var(--rest);min-height:300px;display:flex;justify-content:center;align-items:flex-start;touch-action:pan-y pinch-zoom}
.pdfwrap canvas{display:block;background:#fff;max-width:none}
.toc{display:grid;gap:2px;margin-top:8px}
.toc button{display:flex;justify-content:space-between;gap:10px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;min-height:44px;font-size:15px}
.toc button.here{color:var(--ct);font-weight:700}
details summary{cursor:pointer;font-weight:700;min-height:32px}
.segt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--g2);border-radius:12px;padding:4px}
.segt button{min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:700;color:var(--mut)}
.segt button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.perf div{display:grid;grid-template-columns:8em minmax(0,1fr) 3.2em;gap:10px;align-items:center;font-size:14px;margin-top:8px}
.perf i{display:block;height:12px;border-radius:4px;background:var(--c)}
.perf .track{background:var(--rest);border-radius:4px;overflow:hidden}
.perf b{text-align:right}
.pinbox{max-width:320px;margin:0 auto;text-align:center}
.pinbox input{font-size:28px;letter-spacing:.5em;text-align:center;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.err{color:var(--fx);font-size:14px;min-height:20px;margin-top:6px}

.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acts{display:flex;align-items:center;gap:8px}
.chipf{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px 0 8px;border-radius:20px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font-weight:700;font-size:15px}
.chipf svg{width:24px;height:24px}
.chipf.on{background:rgba(244,196,48,.18);border-color:var(--sun)}
.sino{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;padding:0}
.sino svg{width:22px;height:22px}
.sino i{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--fx);color:#fff;font:700 12px/20px Barlow;font-style:normal;padding:0 5px}
.avp{width:42px;height:42px;border-radius:50%;border:2px solid var(--sun);background:rgba(255,255,255,.12);color:var(--sun);font:700 20px "Barlow Condensed";padding:0;overflow:hidden;display:grid;place-items:center}
.avp img{width:100%;height:100%;object-fit:cover}
@media(max-width:400px){.toprow .back{font-size:14px}.chipf span{font-size:14px}}
.painel{border:2px solid var(--g)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ph h2{margin:0 0 8px}
.x{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:inherit;font-size:24px;line-height:1;padding:0;opacity:.7}
.fgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.fgrid .h{font-size:12px;font-weight:700;color:var(--mut)}
.fd{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:600;border:1px solid var(--line)}
.fd svg{width:70%;height:70%}
.fd.est{background:light-dark(#fff1e0,#3a2612);border-color:#f08a24}
.fd.folga{background:var(--rest);color:var(--mut);border-style:dashed}
.fd.perdeu{color:var(--fx);border-color:light-dark(#f2c2bc,#5a2a24)}
.fd.fut{color:var(--mut);opacity:.6}
.fd.hj{box-shadow:0 0 0 2px var(--g)}
.big{font:700 26px "Barlow Condensed"}
.av-it{padding:10px 0 10px 12px;border-top:1px solid var(--line);font-size:15px;border-left:3px solid transparent}
.av-it.novo{border-left-color:var(--fx)}
.alert.av{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding-right:6px}
.alert.av .x{width:32px;height:32px;margin-top:-4px}
#apSair{display:none}
.leitor.cheia{position:fixed;inset:0;z-index:20;margin:0;border-radius:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px)}
.leitor.cheia .pdfwrap{flex:1;min-height:0;align-items:center}
.leitor.cheia > p{display:none}
.leitor.cheia #apSair{display:inline-flex}
.leitor.cheia #apTela{display:none}
body.travado{overflow:hidden}

.top{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line)}
.top svg.topo{display:none}
.top small{opacity:1;color:var(--mut)}
.top h1{color:var(--ink)}
.back{color:var(--ink);opacity:1}
.count b{color:var(--g)}
.bar{background:var(--rest)}
.chipf{border-color:var(--line);background:var(--bg);color:var(--ink)}
.chipf.on{background:var(--g2);border-color:var(--g);color:var(--g)}
.sino{border-color:var(--line);background:var(--bg);color:var(--ink)}
.avp{border-color:var(--g);background:var(--g2);color:var(--g)}
.foto{background:var(--g2);border-color:var(--g);color:var(--g)}
.fotobtn{color:var(--ink)}
.tabs button[aria-current=true]{color:var(--g)}
.ico{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);flex:none}
.ico svg{width:19px;height:19px}
.menu{display:grid;gap:2px}
.menu button,.menu .it{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 4px;background:none;border:0;border-top:1px solid var(--line);text-align:left;font-size:16px;font-weight:500;color:var(--ink)}

   Cada concurso vira um "contexto": matérias com cor, fila de conteúdo (QC), fila de revisão (QR),
   reta final e datas. O IBGE usa os dados feitos à mão acima; os outros concursos (vitrine, PDF do
   edital ou conteúdo colado) são montados a partir de c.materias = [{nome, q, topicos:[[título, dica]]}].
   Assim Hoje, Calendário, foguinho, Edital e Prova funcionam igual para qualquer concurso. */
const PAL = ['#2f6fd0','#1d8a52','#d9622b','#6b4fbf','#d6457f','#0e8f9c','#b07d12','#a3324a','#5b7a1f','#3d5a80','#c0392b','#8e44ad','#16a085','#7d6b5d'];
/* contas especiais (e o modo sem conta) veem as aulas do Gran no IBGE; as outras contas não */
const ESPEC = () => !NV.user || NV.especial;
const semGran = t => String(t||'').replace(/^Gran aula (\d+):\s*/, 'Videoaula $1: ').replace(/^Gran:\s*/, '').replace(/ Gran:/, ':');
/* intercala as matérias na proporção do peso (round-robin ponderado suave) */
function rotacao(ids, peso){
  const cur = Object.fromEntries(ids.map(i => [i,0])), tot = ids.reduce((a,i) => a + peso[i], 0), out = [];
  for(let k = 0; k < Math.min(tot, 3000); k++){let best = null; for(const i of ids){cur[i] += peso[i]; if(best === null || cur[i] > cur[best]) best = i} cur[best] -= tot; out.push(best)}
  return out;
}
function montaFila(mat, rot, revrot, nrev){
  const ptr = {}, rk = {}, QC = [], QR = []; let ok = true;
  for(const m in mat){ptr[m] = 0; rk[m] = 0}
  while(ok && rot.length){ok = false; for(const m of rot){const it = mat[m].itens[ptr[m]]; if(!it) continue; ok = true;
    QC.push({id:m+'-'+(it[6] ?? ptr[m]), m, t:it[0], g:it[1], k:it[2], pg:it[3] ? [it[3],it[4]] : null, u:it[5] || null}); ptr[m]++}}
  for(let i = 0; revrot.length && i < nrev; i++){const m = revrot[i % revrot.length], k = rk[m]++, rv = mat[m].rev, t = rv[k % rv.length];
    QR.push({id:m+'-r'+k, m, t:'Revisão: '+t, k:/^(Flashcards|Releitura)/.test(t) ? 'l' : 'q', rev:1})}
  return {QC, QR};
}
/* feriados nacionais (fixos + Carnaval, Sexta-feira Santa e Corpus Christi) e as vésperas 24 e 31/12 */
function pascoa(y){const a = y%19, b = Math.floor(y/100), c = y%100, d = Math.floor(b/4), e = b%4, f = Math.floor((b+8)/25), g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15)%30, i = Math.floor(c/4), k = c%4, l = (32+2*e+2*i-h-k)%7, m = Math.floor((a+11*h+22*l)/451), mes = Math.floor((h+l-7*m+114)/31), dia = ((h+l-7*m+114)%31)+1; return iso(new Date(y,mes-1,dia))}
function feriadosNac(de, ate){
  const out = []; if(!de || !ate) return out;
  for(let y = +de.slice(0,4); y <= +ate.slice(0,4); y++){
    ['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-24','12-25','12-31'].forEach(md => out.push(y+'-'+md));
    const p = pascoa(y); out.push(addD(p,-48), addD(p,-47), addD(p,-2), addD(p,60));
  }
  return out.filter(d => d >= de && d <= ate).sort();
}
const CTXC = new Map();
function ctxDe(c){
  const chave = c.id+'|'+(c._v||0)+'|'+ESPEC()+'|'+(c.data||'')+'|'+(c.fimConteudo||'')+'|'+(c.inicio||'');
  if(CTXC.has(chave)) return CTXC.get(chave);
  let cx;
  if(c === IBGE){
    const esp = ESPEC(), mat = {};
    for(const [k,m] of Object.entries(MAT_IBGE)) mat[k] = {...m,
      itens: esp ? m.itens : m.itens.map(it => [semGran(it[0]), /Gran/.test(it[1]||'') ? '' : it[1], it[2], it[3], it[4], null])};
    const {QC, QR} = montaFila(mat, ROT, REVROT, 220);
    cx = {c, ibge:true, MAT:mat, QC, QR, EDITAL:QC.filter(a => a.m !== 'qs'), SUBJ:['ct','pt','mt'], LEG:['pt','mt','ct','qs','fx'], TAGS:TAGS0, FT:FT_IBGE,
      inicio:IBGE.inicio, fimConteudo:IBGE.fimConteudo, feriados:IBGE.feriados, data:IBGE.data};
  } else {
    const mat = {}, TG = {rv:'Revisão', fx:'Reta final'}, ids = [];
    (c.materias||[]).forEach((m,i) => {
      const id = m.id || 'm'+i; ids.push(id);
      mat[id] = {nome:m.nome, cor:PAL[i % PAL.length], q:m.q||0, itens:(m.topicos||[]).filter(t => t && t[0]).map(t => [t[0], t[1]||'', t[2]||'aq', null, null, null, t[3] ?? null]),
        rev:['Questões de '+m.nome, 'Releitura dos resumos de '+m.nome, 'Flashcards de '+m.nome, 'Refazer as questões que errou em '+m.nome]};
      TG[id] = m.nome.length > 22 ? m.nome.slice(0,20).trim()+'…' : m.nome;
    });
    const usa = ids.filter(id => mat[id].itens.length);
    const peso = Object.fromEntries(usa.map(id => [id, mat[id].itens.length]));
    const pesoR = Object.fromEntries(usa.map(id => [id, Math.max(1, mat[id].q || mat[id].itens.length)]));
    const {QC, QR} = montaFila(mat, rotacao(usa, peso), rotacao(usa, pesoR), 400);
    const data = c.data, ini = c.inicio || hoje(), dd = Math.round((parse(data) - parse(ini))/864e5);
    /* reta final de 7 dias; se a prova está perto, a reta final encolhe */
    const fim = c.fimConteudo || addD(data, dd >= 28 ? -8 : -Math.max(1, Math.floor(dd/4)));
    const FTg = Object.fromEntries(ids.map(id => [id, ['Revisão final de '+mat[id].nome+': resumos, flashcards e questões','lq']]));
    cx = {c, ibge:false, MAT:mat, QC, QR, EDITAL:QC, SUBJ:usa, LEG:[...usa,'fx'], TAGS:TG, FT:FTg, inicio:ini, fimConteudo:fim, feriados:feriadosNac(ini, data), data};
  }
  CTXC.set(chave, cx); return cx;
}

function P(pid,cid){
  const k = pid+'|'+cid;
  if(!S.prog[k]) S.prog[k] = {done:{}, inicio:cid === IBGE.id ? IBGE.inicio : (S.extras[cid]?.inicio || hoje()), feriados:true, pausas:[], extra:{}, placar:{}, perdao:[], recorde:0};

  if(!p.ritmo){p.ritmo = {0:1,1:1,2:1,3:1,4:1,5:1,6:3}; if(p.dias) for(let w = 0; w < 7; w++) if(!p.dias.includes(w)) p.ritmo[w] = 0; delete p.dias}
  /* migração da v2: assunto marcado inteiro vira todas as etapas marcadas */
  if(cid === IBGE.id) for(const a of [...ctxDe(IBGE).QC,...ctxDe(IBGE).QR]) if(p.done[a.id] && typeof p.done[a.id] === 'string'){for(const s of STEPS[a.k]) p.done[a.id+':'+s] = p.done[a.id]; delete p.done[a.id]}
  return p;
}

/* ---------- Etapas e fila ---------- */
const sd = (p,a,s) => p.done[a.id+':'+s];
const aDone = (p,a) => {let mx = ''; for(const s of STEPS[a.k]){const d = sd(p,a,s); if(!d) return null; if(d > mx) mx = d} return mx};
const aPart = (p,a) => STEPS[a.k].filter(s => sd(p,a,s)).length;
const pausado = (p,d) => p.pausas.some(x => d >= x.de && d <= x.ate);
const capDia = (p,d) => {const ini = p.inicio || CX.inicio; if(d < ini || d > CX.fimConteudo || pausado(p,d) || (p.feriados && CX.feriados.includes(d))) return 0; return p.ritmo[parse(d).getDay()] || 0};
const motivoFolga = (p,d) => pausado(p,d) ? 'Pausa' : (p.feriados && CX.feriados.includes(d)) ? 'Feriado' : 'Folga';

function placarStats(p){
  const st = {mx:{a:0,t:0}}; for(const m of SUBJ) st[m] = {a:0,t:0};
  for(const r of Object.values(p.placar)){const k = st[r.m] ? r.m : 'mx'; st[k].a += r.a; st[k].t += r.t}
  return st;
}
const pctAc = x => x.t ? Math.round(100*x.a/x.t) : null;
function fracos(p){const st = placarStats(p); return [...SUBJ].sort((x,y) => {const a = st[x].t >= 5 ? st[x].a/st[x].t : .99, b = st[y].t >= 5 ? st[y].a/st[y].t : .99; return a - b || SUBJ.indexOf(x) - SUBJ.indexOf(y)})}
function finais(p){
  const ord = fracos(p), out = [];
  if(CX.ibge){
    ord.forEach((m,i) => out.push([addD('2027-01-25',i), {id:'fx-'+m, m, t:FT[m][0], k:FT[m][1], fin:1}]));
    FIXOS.forEach(([d,id,t]) => out.push([d, {id, m:'fx', t, k:'x', fin:1}]));

    return out;
  }
  /* outros concursos: revisão final por matéria (a mais fraca primeiro) nos dias entre o fim do conteúdo e a prova,
     simulado 3 dias antes, correção 2 dias antes e dia leve na véspera */
  const c = CX.c, d0 = addD(CX.fimConteudo,1), dv = addD(CX.data,-4), dias = [];
  for(let d = d0; d <= dv; d = addD(d,1)) dias.push(d);
  if(!dias.length) dias.push(d0 <= CX.data ? d0 : CX.data);
  ord.forEach((m,i) => out.push([dias[Math.floor(i*dias.length/ord.length)], {id:'fx-'+m, m, t:FT[m][0], k:FT[m][1], fin:1}]));
  const nq = SUBJ.reduce((a,m) => a + (MAT[m].q||0), 0);
  if(addD(CX.data,-3) > CX.fimConteudo){

  return out;
}

function plano(p){
  const h = hoje(), out = {}, add = (d,a) => (out[d] = out[d] || []).push(a);
  const pend = [];
  for(const a of [...QC,...QR]){const d = aDone(p,a); if(d) add(d,a); else pend.push(a)}
  let i = 0, fim = null, iHoje = 0;
  for(let d = h; d <= CX.fimConteudo && i < pend.length; d = addD(d,1)){
    let vagas = capDia(p,d) + (d === h ? (p.extra[h]||0) : 0) - (d === h ? (out[h]||[]).length : 0);
    while(vagas-- > 0 && i < pend.length){add(d,pend[i]); if(!pend[i].rev) fim = d; i++}
    if(d === h) iHoje = i;
  }
  const sobra = pend.slice(i).filter(a => !a.rev).length;
  if(!fim){const feitos = QC.map(a => aDone(p,a)).filter(Boolean).sort(); if(!pend.some(a => !a.rev)) fim = feitos[feitos.length-1] || null}
  for(const [d,a] of finais(p)) add(d,a);
  return {out, fim, sobra, prox:pend[iHoje] || null};
}

function sequencia(p,pl){
  const h = hoje(), ini = p.inicio || CX.inicio, act = new Set(Object.values(p.done));
  const conta = from => {let s = 0, d = from, miss = null;
    for(let g = 0; g < 500; g++){
      if(act.has(d)) s++;
      else if(d < ini) break;
      else if(capDia(p,d) > 0 && !p.perdao.includes(d)){miss = d; break}
      d = addD(d,-1);
    } return {s, miss}};
  const r = conta(act.has(h) ? h : addD(h,-1));
  const prev = r.miss ? conta(addD(r.miss,-1)).s : 0;
  const feitosHoje = (pl.out[h]||[]).filter(a => !a.fin && aDone(p,a) === h).length;
  const precisa = Math.max(1, capDia(p,h) + 1);
  return {s:r.s, hojeOk:act.has(h), miss:r.miss, prev, recuperavel: !!(r.miss && prev > 0 && r.miss >= addD(h,-3)), feitosHoje, precisa};
}

async function abrirPagina(n){
  const ap = apPerfil(); n = Math.max(1, Math.min(AP_PAGS, n)); ap.pag = n; if(n > ap.max) ap.max = n; save();
  const lab = document.getElementById('apPg'), wrap = document.getElementById('apWrap'), cv = document.getElementById('apCv');
  if(!wrap) return;
  if(lab) lab.textContent = `p. ${n} de ${AP_PAGS}`;
  const bar = document.getElementById('apBar'); if(bar) bar.style.width = (100*ap.max/AP_PAGS)+'%';
  const mx = document.getElementById('apMax'); if(mx) mx.textContent = ap.max;
  document.querySelectorAll('.toc button').forEach(b => b.classList.toggle('here', +b.dataset.ap <= n && (+b.nextElementSibling?.dataset.ap || 999) > n));
  try{
    const doc = await loadPdf(), page = await doc.getPage(n);
    const vp0 = page.getViewport({scale:1}), cheia = document.getElementById('apLeitor')?.classList.contains('cheia');
    const base = cheia ? Math.min(wrap.clientWidth / vp0.width, (wrap.clientHeight - 4) / vp0.height) : Math.max(280, wrap.clientWidth) / vp0.width;
    const sc = base * apZoom, dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const vp = page.getViewport({scale:sc*dpr});
    if(apRender) try{apRender.cancel()}catch(e){}
    cv.width = vp.width; cv.height = vp.height; cv.style.width = (vp.width/dpr)+'px'; cv.style.height = (vp.height/dpr)+'px';
    apRender = page.render({canvasContext:cv.getContext('2d'), viewport:vp}); await apRender.promise.catch(() => {});
    const st = document.getElementById('apStatus'); if(st) st.textContent = '';
  }catch(e){const st = document.getElementById('apStatus'); if(st) st.textContent = 'Não deu para abrir a apostila. Confira a internet na primeira vez; depois ela fica salva no aparelho.'}
}

/* ---------- v4.8: simulados, nível, revisão espaçada e lembrete diário ---------- */
/* Tudo guardado no progresso de cada concurso (p): p.sim (simulados), p.simAtivo (cronômetro rodando), p.meta (nota-alvo, %),
   p.resultado (prova de verdade), p.rev (pilha de revisões), p.revN (revisões feitas), p.rvAsk (perguntar ao concluir), p.lembrete {on,hora}. */
const NIVEL = [['Iniciante',0],['Aprendiz',50],['Persistente',120],['Competitivo',220],['Avançado',360],['Aprovável',540],['Elite',780],['Lenda',1100]];
const PRAZOS = [1,3,7,15,30];
/* questões por matéria: dos dados da matéria ou, no IBGE, da tabela da prova */
const qDe = m => (MAT[m] && MAT[m].q) || ((CX && CX.c.prova) || []).filter(x => x[2] === m).reduce((a,x) => a + x[1], 0);
const ehCeb = () => /cebraspe|cespe/i.test((CX && CX.c.banca) || '');
/* nota em %: na Cebraspe (certo/errado) cada errada anula uma certa, por isso o campo "erradas" */
const simNota = s => s.t ? Math.round(100*Math.max(0, s.a - (s.e||0))/s.t) : 0;

const hhmm = t => pad(new Date(t).getHours())+':'+pad(new Date(t).getMinutes());

/* XP: cada simulado vale de 10 a 60 pontos conforme o acerto (por disciplina vale 60% disso);
   bater o próprio recorde num completo dá +15 e cada revisão feita dá +3 */
function simXP(p){
  let xp = 0, best = -1;
  for(const s of SIMN(p)){
    const n = simNota(s); let g = Math.round((10 + n/2) * (s.tipo === 'completo' ? 1 : .6));
    if(s.tipo === 'completo'){if(best >= 0 && n > best) g += 15; best = Math.max(best, n)}
    xp += g;

function nivelDe(xp){
  let i = 0; while(i+1 < NIVEL.length && xp >= NIVEL[i+1][1]) i++;

/* acertos por matéria em todos os simulados (completos e por disciplina), em %, do mais antigo ao mais novo */
function simPorMat(p){

/* resultado a anotar: ou o cronômetro foi parado (p.simAtivo.fim) ou a pessoa escolheu anotar um simulado que já fez (V.simRes) */

function simCrono(c,p){

/* formulário de resultado: serve para o simulado e para a prova de verdade (kind = 'sim' ou 'prova') */

/* gráfico de evolução: nota (%) de cada simulado ao longo do tempo, até o dia da prova */
function graficoSim(c,p){
  const all = SIMN(p), L = all.filter(s => s.tipo === 'completo'), h = hoje(), ult = all[all.length-1].d;
  let x0 = all[0].d; if(h < x0) x0 = h;
  let x1 = c.data; if(ult > x1) x1 = ult; if(p.resultado && p.resultado.d > x1) x1 = p.resultado.d;
  if(x1 <= x0) x1 = addD(x0, 30);
  const W = 340, H = 200, ml = 30, mr = 16, mt = 14, mb = 28, span = (parse(x1) - parse(x0))/864e5;
  const dd = d => (parse(d) - parse(x0))/864e5;
  const X = d => +(ml + (W-ml-mr)*dd(d)/span).toFixed(1), Y = v => +(mt + (H-mt-mb)*(1 - v/100)).toFixed(1);
  let g = '';
  for(const v of [0,25,50,75,100]) g += `<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${ml-5}" y="${Y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--mut)">${v}</text>`;
  const meta = metaDe(p);
  g += `<line x1="${ml}" x2="${W-mr}" y1="${Y(meta)}" y2="${Y(meta)}" stroke="var(--ct)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="${ml+4}" y="${Y(meta)-4}" font-size="10" font-weight="700" fill="var(--ct)">meta ${meta}%</text>`;
  if(CX.ibge) g += `<line x1="${ml}" x2="${W-mr}" y1="${Y(30)}" y2="${Y(30)}" stroke="var(--fx)" stroke-width="1.2" stroke-dasharray="2 3"/><text x="${ml+4}" y="${Y(30)-4}" font-size="10" fill="var(--fx)">mínimo para passar (30%)</text>`;
  if(h > x0 && h < x1) g += `<line x1="${X(h)}" x2="${X(h)}" y1="${mt}" y2="${H-mb}" stroke="var(--mut)" stroke-width="1" stroke-dasharray="1 3"/><text x="${X(h)}" y="${H-mb+22}" text-anchor="middle" font-size="9" fill="var(--mut)">hoje</text>`;
  g += `<line x1="${X(c.data)}" x2="${X(c.data)}" y1="${mt}" y2="${H-mb}" stroke="var(--g)" stroke-width="1.5" opacity=".55"/><text x="${X(c.data)}" y="${mt-3}" text-anchor="end" font-size="10" font-weight="700" fill="var(--g)">${c.pre ? 'meta' : 'prova'}</text>`;
  /* tendência: reta de mínimos quadrados sobre os completos, estendida até a prova (só com 3 ou mais) */
  let proj = null;
  if(L.length >= 3){
    const pts = L.map(s => [dd(s.d), simNota(s)]), n = pts.length, sx = pts.reduce((a,q) => a+q[0], 0), sy = pts.reduce((a,q) => a+q[1], 0), sxx = pts.reduce((a,q) => a+q[0]*q[0], 0), sxy = pts.reduce((a,q) => a+q[0]*q[1], 0), den = n*sxx - sx*sx;
    if(den > 0 && c.data > ult && dd(L[L.length-1].d) - dd(L[0].d) >= 7){

      g += `<line x1="${X(L[L.length-1].d)}" y1="${Y(simNota(L[L.length-1]))}" x2="${X(c.data)}" y2="${Y(proj)}" stroke="var(--g)" stroke-width="2" stroke-dasharray="3 4" opacity=".7"/><circle cx="${X(c.data)}" cy="${Y(proj)}" r="3.5" fill="none" stroke="var(--g)" stroke-width="2"/>`;
    }
  }
  if(L.length > 1) g += `<polyline fill="none" stroke="var(--g)" stroke-width="2.5" stroke-linejoin="round" points="${L.map(s => X(s.d)+','+Y(simNota(s))).join(' ')}"/>`;
  for(const s of all.filter(s => s.tipo !== 'completo')) g += `<circle cx="${X(s.d)}" cy="${Y(simNota(s))}" r="3.2" fill="${MAT[s.m] ? MAT[s.m].cor : 'var(--mut)'}" opacity=".85"><title>${esc(s.nome || nomeSim(s.tipo))}: ${simNota(s)}%</title></circle>`;
  for(const s of L) g += `<circle cx="${X(s.d)}" cy="${Y(simNota(s))}" r="4.5" fill="var(--g)" stroke="var(--card)" stroke-width="2"><title>${esc(fmt(s.d))}: ${simNota(s)}%</title></circle>`;
  if(p.resultado) g += `<text x="${X(p.resultado.d)}" y="${Y(simNota(p.resultado))+5}" text-anchor="middle" font-size="18" fill="var(--mt)">★<title>Prova: ${simNota(p.resultado)}%</title></text>`;
  g += `<text x="${ml}" y="${H-8}" font-size="10" fill="var(--mut)">${dm(x0)}</text><text x="${W-mr}" y="${H-8}" text-anchor="end" font-size="10" fill="var(--mut)">${dm(x1)}</text>`;
  return {svg:`<svg class="grafsim" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico da nota dos simulados ao longo do tempo, com a meta de ${meta}%">${g}</svg>`, proj};
}

function vSimulado(c,p){

function salvaSim(f,fd){
  const p = PP(), prova = f.id === 'provaForm', tipo = f.dataset.tipo || 'completo', por = {};

  for(const inp of f.querySelectorAll('input[name^="t_"]')){

    if(!(ta > 0)) continue;

    a += ac; t += ta; if(k !== 'all') por[k] = {a:ac, t:ta};
  }

  const antes = nivelDe(simXP(p));
  const s = {id:'s'+Date.now().toString(36), d, tipo, nome:String(fd.get('nome')||'').trim().slice(0,60), m:tipo === 'completo' ? '' : tipo, a, t, e, por:Object.keys(por).length ? por : undefined, min:Number(fd.get('min')) || Number(f.dataset.via === 'timer' ? (ctxRes(p)||{}).min : 0) || 0, lim:Number(f.dataset.lim)||0, via:f.dataset.via};
  (p.sim = p.sim || []).push(s); p.done['sim-'+s.id] = d; delete p.simAtivo; V.simRes = null; save();
  const dep = nivelDe(simXP(p));
  toast(dep.n > antes.n ? 'Subiu de nível! Agora você é '+dep.nome : 'Simulado salvo: '+simNota(s)+'% de acerto'); keep();
}

/* status automático pela data: inscrições abertas (curto prazo) → pós-edital até a prova (médio) → pré-edital (longo) */
function statusDe(t, h = hoje()){
  const [ini, fim] = t.inscricoes || [];
  if(fim && h <= fim) return ini && h < ini ? {k:'breve', txt:'Inscrições em breve', prazo:'Curto prazo'} : {k:'abertas', txt:'Inscrições abertas', prazo:'Curto prazo'};
  if(t.prova && h <= t.prova) return {k:'pos', txt:'Pós-edital', prazo:'Médio prazo'};
  return {k:'pre', txt:`Concurso realizado · pré-edital (base: edital de ${t.ano || String(t.prova||'').slice(0,4)})`, prazo:'Longo prazo'};
}

/* ---------- Leitura do edital no navegador (sem IA): PDF.js + regras ---------- */
function pdfLib(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((ok,err) => {const s = document.createElement('script'); s.src = 'vendor/pdf.min.js'; s.onload = () => {window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js'; ok(window.pdfjsLib)}; s.onerror = err; document.head.appendChild(s)});
}
/* junta os pedaços de texto de cada página em linhas, pela altura (y) e pela distância (x) */
async function textoDoPdf(file, prog){
  const lib = await pdfLib(), doc = await lib.getDocument({data:await file.arrayBuffer()}).promise;
  let out = '';
  for(let i = 1; i <= doc.numPages; i++){
    const tc = await (await doc.getPage(i)).getTextContent(), linhas = [];
    for(const it of tc.items){if(!it.str) continue; const y = it.transform[5], x = it.transform[4];
      let L = linhas.find(l => Math.abs(l.y - y) < 2.5); if(!L){L = {y, its:[]}; linhas.push(L)} L.its.push({x, w:it.width||0, s:it.str})}
    linhas.sort((a,b) => b.y - a.y);
    for(const L of linhas){L.its.sort((a,b) => a.x - b.x); let s = '', fim = null;
      for(const it of L.its){if(fim !== null && it.x > fim + 1.5 && !/\s$/.test(s) && !/^\s/.test(it.s)) s += ' '; s += it.s; fim = it.x + it.w}
      out += s + '\n'}
    out += '\f\n'; if(prog) prog(i, doc.numPages);
  }
  return out;
}
const limpaTxt = t => String(t).replace(/ﬁ/g,'fi').replace(/ﬂ/g,'fl').replace(/[​­]/g,'').replace(/\r/g,'').replace(/\f/g,'\n')
  .replace(/^.*(pciconcursos|pcimarkpci|Página \d+ de \d+).*$/gm,'').replace(/^\s*\d+(\.\d+){2,}\s+[A-ZÀ-Ý ]+$/gm,'').replace(/-\n(?=[a-zà-ú])/g,'');
const PEQ = new Set(['de','da','do','das','dos','e','em','a','o','ou','para','com','no','na','à']);
const tituloMat = n => {n = n.replace(/\s+/g,' ').trim().replace(/\.$/,''); if(n !== n.toUpperCase()) return n[0].toUpperCase()+n.slice(1);
  return n.toLowerCase().split(' ').map((w,i) => i && PEQ.has(w) ? w : w.slice(0,1).toUpperCase()+w.slice(1)).join(' ')};
/* "MATÉRIA: 1 Tópico. 1.1 Sub. 2 Tópico." → tópicos de topo (1, 2, 3…), com os subitens como dica */
function topicosDe(corpo){
  corpo = corpo.replace(/\s+/g,' ').trim();
  const re = /(\d{1,2})(?:\s*[.)\-–]\s+|\s+)(?=[A-ZÀ-Ýa-zà-ý])/g, pos = []; let esp = 1, m;
  while((m = re.exec(corpo))){const ant = corpo[m.index-1]; if(ant && /[\wÀ-ÿ.,\/º-]/.test(ant)) continue; if(+m[1] === esp){pos.push([m.index, m.index + m[0].length]); esp++}}
  const apara = t => t.replace(/^[ .;]+|[ .;]+$/g,'');
  if(!pos.length) return corpo.length > 3 ? [[apara(corpo), '']] : [];
  const out = [];
  pos.forEach(([,b],i) => {
    let t = corpo.slice(b, i+1 < pos.length ? pos[i+1][0] : corpo.length);
    t = apara(t.split(/\s\d{1,3}\s+[A-ZÀ-Ý][A-ZÀ-Ý ()]{5,}:/)[0].replace(/\s*\d+(\.\d+)+\.?\s*$/,''));
    if(!t || /^[a-zà-ý]/.test(t)) return;
    let ti = t, di = ''; const sm = (' '+t).search(/\s\d+\.\d+\.?\s/);
    if(sm > 0){ti = t.slice(0, sm-1).replace(/[ .;:]+$/,''); di = t.slice(sm-1).trim()}
    if(ti.length > 95){const mm = ti.match(/^(.{12,90}?)(?: – | - |: |\. )/); if(mm){di = (ti.slice(mm[0].length) + (di ? ' '+di : '')).trim(); ti = mm[1].trim()}}
    if(ti) out.push(di ? [ti, di] : [ti]);
  });
  return out;
}
function parseConteudo(txt){
  txt = limpaTxt(txt); const re = /^[ \t]*([A-ZÀ-Ý][^:\n]{2,90}?)\s*:\s*(?=1(?:[.)\-–]|\s))/gm, ms = [...txt.matchAll(re)], out = [];
  ms.forEach((m,i) => {const tp = topicosDe(txt.slice(m.index + m[0].length, i+1 < ms.length ? ms[i+1].index : txt.length)); if(tp.length) out.push({nome:tituloMat(m[1]), topicos:tp})});
  return out;
}
/* separa por cargo ou nível quando o edital tem vários */
function secoes(txt){
  txt = limpaTxt(txt);
  const h = txt.match(/^[\s\d.]*(?:ANEXO [IVX]+\s*[–-]?\s*)?(?:D[OA]S? )?(CONTE[ÚU]DOS? PROGRAM[ÁA]TICOS?|OBJETOS DE AVALIA[ÇC][ÃA]O)/m);
  const corpo = h ? txt.slice(h.index) : txt;
  const mk = /^[ \t]*(?:\d+(?:\.\d+)*\s+)?(CARGO\s+\d+\s*[:–-]\s*[^\n]{3,120}|PARA O CARGO DE\s+[^\n]{3,120}|N[ÍI]VEL\s+(?:FUNDAMENTAL|M[ÉE]DIO|SUPERIOR)[^\n]{0,40})\s*$/gm;
  const cortes = [...corpo.matchAll(mk)], secs = [];
  cortes.forEach((m,i) => secs.push({nome:tituloMat(m[1].replace(/\s+/g,' ')), materias:parseConteudo(corpo.slice(m.index + m[0].length, i+1 < cortes.length ? cortes[i+1].index : corpo.length))}));
  const boas = secs.filter(s => s.materias.length);
  return boas.length ? boas : [{nome:'', materias:parseConteudo(corpo)}].filter(s => s.materias.length);
}
const BANCAS = ['Cebraspe','Cesgranrio','FGV','FCC','Vunesp','Instituto AOCP','IBFC','Idecan','Quadrix','CPCon','Consulplan','Fundatec','Iades','Ibade','Selecon','Objetiva','Fepese','Avança SP','IBAM','Fundep','UPENET','IAUPE','Instituto Access','COMPEC','Comperve','Funcab','Cetrede','Instituto Consulplan','Legalle','Fafipa','Fundação La Salle'];
function achaInfo(txt){
  const L = txt.split('\n'), h = hoje(); let prova = null;
  for(let i = 0; i < L.length; i++) if(/(aplica[çc][ãa]o|realiza[çc][ãa]o) d[ao]s? (prova|exame)/i.test(L[i])){
    const m = (L[i]+' '+(L[i+1]||'')).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(!m) continue;
    const d = m[3]+'-'+pad(m[2])+'-'+pad(m[1]); if(!prova || (d >= h && (prova < h || d < prova))) prova = d}
  let banca = '', mx = 0;
  for(const b of BANCAS){const n = (txt.match(new RegExp(b.replace(/ /g,'\\s+'), 'gi'))||[]).length; if(n > mx){mx = n; banca = b}}
  return {prova, banca};
}

function lerRev(){

/* passo 1 do novo concurso: lê o PDF (ou o texto colado) e separa as matérias */
async function lerNovo(f, fd){
  const r = V.rascunho, st = document.getElementById('pdfSt'), arq = document.getElementById('pdfIn')?.files[0];
  Object.assign(r, {nome:String(fd.get('nome')).trim(), cargo:String(fd.get('cargo')).trim(), banca:String(fd.get('banca')).trim(), data:String(fd.get('data')||''), hora:String(fd.get('hora')).trim(),
    local:String(fd.get('local')).trim(), pre:!!fd.get('pre'), meses:Number(fd.get('meses'))||6, plat:String(fd.get('plat')||''), curso:String(fd.get('curso')).trim(), texto:String(fd.get('texto')||''),
    links:{inscricao:String(fd.get('li')).trim(), edital:String(fd.get('le')).trim(), banca:String(fd.get('lb')).trim()}});
  let txt = r.texto;
  if(arq){
    try{st.textContent = 'Abrindo o PDF…'; txt = await textoDoPdf(arq, (i,n) => {st.textContent = `Lendo o PDF: página ${i} de ${n}…`})}
    catch(e){st.textContent = 'Não deu para ler esse PDF. Tente colar o conteúdo no campo de texto.'; return}
    const info = achaInfo(txt); if(!r.data && info.prova && !r.pre) r.data = info.prova; if(!r.banca && info.banca) r.banca = info.banca;
  }
  if(!txt.trim()){st.textContent = 'Envie o PDF do edital ou cole o conteúdo programático.'; return}
  if(!r.pre && !r.data){st.textContent = 'Coloque a data da prova ou marque "Ainda sem data de prova".'; render(); return}
  let secs = secoes(txt);
  if(!secs.length && !arq){const linhas = txt.split('\n').map(x => x.trim()).filter(x => x.length > 2); if(linhas.length) secs = [{nome:'', materias:[{nome:'Conteúdo', topicos:linhas.map(l => [l])}]}]}
  if(!secs.length){st.textContent = 'Não encontrei o conteúdo programático nesse PDF. Copie o trecho das matérias e cole no campo de texto.'; return}
  if(secs.length > 1){r.secoes = secs} else r.materias = comIds(secs[0].materias);
  render(); scrollTo(0,0);
}

  if(f.id === 'lembForm'){const p = PP(), hr = String(fd.get('hora')||'19:00'); p.lembrete = {on:true, hora:hr}; save(); toast('Lembrete salvo para as '+hr); keep(); return}
  if(f.id === 'nomeForm'){const n = String(fd.get('nome')).trim(); if(n){S.perfis.find(x => x.id === V.perfil).nome = n; save(); toast('Nome salvo'); keep()} return}
  if(f.id === 'addPerfil'){const n = String(fd.get('n')).trim(), pin = String(fd.get('pin')||''); if(!n) return; if(pin && !/^\d{4}$/.test(pin)){toast('O PIN precisa ter 4 números'); return}
    const id = S.perfis.length ? 'p'+Date.now().toString(36) : n.toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'') || 'p1';
    const pf = {id, nome:n, concursos:['ibge2027']}; if(pin) pf.pin = hashPin(pin,id); S.perfis.push(pf); save(); V = {...V, view:'concursos', perfil:id, pinOk:id, novo:false}; render(); scrollTo(0,0)}
  if(f.id === 'pinCheck'){const pf = S.perfis.find(x => x.id === V.pinFor); if(pf && hashPin(String(fd.get('pin')),pf.id) === pf.pin){V = {...V, view:'concursos', perfil:pf.id, pinOk:pf.id}; render()} else {document.getElementById('pinErr').textContent = 'PIN incorreto'; f.reset()}}
  if(f.id === 'pinForm'){const pin = String(fd.get('pin')); if(!/^\d{4}$/.test(pin)){toast('O PIN precisa ter 4 números'); return} const pf = S.perfis.find(x => x.id===V.perfil); pf.pin = hashPin(pin,pf.id); V.pinEdit = false; V.pinOk = pf.id; save(); toast('PIN salvo'); keep()}
  if(f.id === 'plForm'){const a = Number(fd.get('a')), t = Number(fd.get('t')); if(!(t > 0) || a < 0 || a > t){toast('Confira os números: acertos não podem passar do total'); return}
    PP().placar[f.dataset.key] = {a, t, m:f.dataset.m, d:hoje()}; V.pl = null; save(); toast(`${Math.round(100*a/t)}% de acerto anotado`); keep()}
  if(f.id === 'avulso'){const a = Number(fd.get('a')), t = Number(fd.get('t')); if(!(t > 0) || a < 0 || a > t){toast('Confira os números'); return}
    const p = PP(), k = 'av-'+Date.now().toString(36); p.placar[k] = {a, t, m:fd.get('m'), d:hoje()}; p.done[k] = hoje(); save(); toast('Questões anotadas'); keep()}
  if(f.id === 'cursoForm'){const p = PP(); p.plat = String(fd.get('plat')||''); p.curso = String(fd.get('curso')||'').trim(); save(); toast('Curso salvo'); keep(); return}
  if(f.id === 'novoForm'){lerNovo(f, fd); return}
  if(f.id === 'revForm'){salvarRev(); return}
  if(f.id === 'addConc'){const id = 'c'+Date.now().toString(36); S.extras[id] = {id, nome:fd.get('nome').trim(), cargo:fd.get('cargo').trim(), banca:fd.get('banca').trim(), data:fd.get('data'), hora:fd.get('hora').trim(), local:fd.get('local').trim(), topicos:String(fd.get('top')).split('\n').map(s => s.trim()).filter(Boolean).map((t,i) => ({id:id+'-'+i, t}))}; S.perfis.find(x => x.id===V.perfil).concursos.push(id); save(); toast('Concurso adicionado'); render()}
  if(f.id === 'addTop'){const c = S.extras[V.conc], t = fd.get('t').trim(); if(t){c.topicos.push({id:c.id+'-'+Date.now().toString(36), t}); save(); render()}}
  if(f.id === 'addPausa'){const p = PP(); let de = fd.get('de'), ate = fd.get('ate') || de; if(ate < de) [de,ate] = [ate,de]; p.pausas.push({de, ate, nome:String(fd.get('nome')||'').trim()}); p.pausas.sort((a,b) => a.de < b.de ? -1 : 1); save(); toast('Pausa adicionada'); keep()}
});
document.addEventListener('toggle', e => {const d = e.target; if(!d.dataset || !d.dataset.mat) return; const ab = new Set(V.abertos||[]); d.open ? ab.add(d.dataset.mat) : ab.delete(d.dataset.mat); V.abertos = [...ab]; try{sessionStorage.setItem(KEY+'-v', JSON.stringify({...V, pl:null}))}catch(err){}}, true);
/* virar a página da apostila deslizando o dedo */
let tx = null, ty = null;
const instaladoIOS = navigator.standalone === true;
let bx = null, by = null, bAtivo = false;
const seta = () => document.getElementById('volta');
document.addEventListener('touchstart', e => {bx = null; if(!instaladoIOS || e.touches.length !== 1 || profundidade() === 0) return; const t = e.touches[0]; if(t.clientX <= 24){bx = t.clientX; by = t.clientY; bAtivo = false}}, {passive:true});
document.addEventListener('touchmove', e => {if(bx === null) return; const t = e.touches[0], dx = t.clientX - bx, dy = Math.abs(t.clientY - by);
  if(!bAtivo && dy > 30 && dy > dx){bx = null; return}
  if(dx > 12) bAtivo = true; const el = seta(); if(!el || !bAtivo) return;
  const p = Math.min(1, dx/110); el.style.opacity = p; el.style.transform = `translate(${Math.min(dx,110)*.55 - 40}px,-50%) scale(${.6+.4*p})`; el.classList.toggle('ok', p >= 1); el.style.top = t.clientY+'px'}, {passive:true});
document.addEventListener('touchend', e => {if(bx === null) return; const dx = e.changedTouches[0].clientX - bx, el = seta(); bx = null;
  if(el){el.style.opacity = 0; el.style.transform = 'translate(-40px,-50%) scale(.6)'; el.classList.remove('ok')}
  if(bAtivo && dx >= 110){if(navigator.vibrate) navigator.vibrate(8); voltar()}}, {passive:true});
document.addEventListener('touchstart', e => {if(e.target.closest('#apWrap') && e.touches.length === 1 && e.touches[0].clientX > 24){tx = e.touches[0].clientX; ty = e.touches[0].clientY} else tx = null}, {passive:true});
document.addEventListener('touchend', e => {if(tx === null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if(apZoom <= 1 && Math.abs(dx) > 60 && Math.abs(dx) > 2*Math.abs(dy)) abrirPagina(apPerfil().pag + (dx < 0 ? 1 : -1))}, {passive:true});
let rz; addEventListener('keydown', e => {if(e.key === 'Escape' && V.revOferta){V.revOferta = null; keep()} else if(e.key === 'Escape' && V.painel){V.painel = ''; keep()}});
addEventListener('resize', () => {clearTimeout(rz); rz = setTimeout(() => {if(document.getElementById('apWrap')) abrirPagina(apPerfil().pag)}, 250)});
/* cronômetro do simulado: atualiza só o relógio, sem redesenhar a tela */
let simAvisou = null;
setInterval(() => {
  const el = document.getElementById('simT'); if(!el) return;
  const ini = Number(el.dataset.ini), lim = Number(el.dataset.lim)*60000, rest = lim - (Date.now() - ini);
  el.textContent = fmtT(rest); el.classList.toggle('estourou', rest <= 0);
  const bar = document.getElementById('simBar'); if(bar) bar.style.width = Math.min(100, 100*(Date.now() - ini)/lim)+'%';
  if(rest <= 0 && simAvisou !== ini){simAvisou = ini; toast('Tempo esgotado!'); if(navigator.vibrate) navigator.vibrate([200,100,200]); notificar('Simulado', 'O tempo acabou. Termine e anote o resultado.', 'simulado')}
}, 1000);
setInterval(lembreteTick, 30000);
document.addEventListener('visibilitychange', () => {if(!document.hidden) lembreteTick()});
iniciarNuvem();
try{if('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai$|claudeusercontent\.com$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {})}catch(e){}
}
</script>
