<style>
/* VOICE: calmo, encorajador, direto — caderneta de campo de recenseador
   IDEA: a prancheta do recenseador: folha de coleta com itens a marcar
   PICTURE: cabeçalho verde com curvas de nível + contagem regressiva grande
   COLOUR and TYPE: verde-campo dominante, branco, amarelo-sol de destaque; Barlow / Barlow Condensed
   LAYOUT: app de celular, uma coluna, barra de abas embaixo */
:root{color-scheme:light dark;
--bg:light-dark(#f6f7f4,#0e1612);--card:light-dark(#ffffff,#16211b);--ink:light-dark(#14201a,#e6eee8);
--mut:light-dark(#5d6b63,#9aaba1);--line:light-dark(#e2e6e1,#26352d);
--g:#1d5a3c;--g2:light-dark(#e3efe7,#1b3326);--sun:#f4c430;--rest:light-dark(#e4e8e3,#25332b);
--pt:#2f6fd0;--mt:#d9622b;--ct:#1d8a52;--qs:#6b4fbf;--rv:#8a7a3a;--fx:#c0392b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{background:var(--g);color:#fff;position:relative;overflow:hidden;padding:calc(env(safe-area-inset-top) + 18px) 0 22px}
.top svg.topo{position:absolute;inset:0;width:100%;height:100%;opacity:.18;pointer-events:none}
.top .wrap{position:relative}
.top small{display:block;opacity:.85;font-size:14px}
.top h1{font-size:clamp(32px,8vw,46px);margin-top:4px}
.back{background:none;border:0;color:#fff;opacity:.9;padding:8px 0;min-height:44px;font-weight:600}
.count{display:flex;align-items:flex-end;gap:14px;margin-top:14px;flex-wrap:wrap}
.count b{font:700 clamp(54px,16vw,84px)/.9 "Barlow Condensed",sans-serif;color:var(--sun)}
.count span{font-size:15px;opacity:.95;padding-bottom:6px}
.bar{height:10px;background:rgba(255,255,255,.22);border-radius:6px;overflow:hidden;margin-top:14px;display:flex}
.bar i{display:block;height:100%;transition:width .4s}
main{padding:18px 0 calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:24px;margin-bottom:10px}
.muted{color:var(--mut);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--g);color:#fff;font-weight:600}
.btn.alt{background:var(--g2);color:var(--ink)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pick{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;min-height:44px}
.pick .av{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--g);color:var(--sun);font:700 26px "Barlow Condensed";margin-right:14px;vertical-align:middle}
.pick .av img,.top .foto img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.pick .av{overflow:hidden}
.foto{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid var(--sun);color:var(--sun);font:700 30px "Barlow Condensed";overflow:hidden;padding:0;cursor:pointer;flex:none}
.who{display:flex;align-items:center;gap:14px;margin-top:4px}
.fotobtn{margin-right:14px;background:none;border:0;color:#fff;opacity:.85;font-size:14px;font-weight:600;text-decoration:underline;padding:6px 0;min-height:32px}
.pick strong{font-size:22px;font-family:"Barlow Condensed";vertical-align:middle}
.conc h3{font-size:26px}
.conc .meta{margin:4px 0 12px}
.mini{height:8px;background:var(--g2);border-radius:5px;overflow:hidden;display:flex}
.mini i{display:block;height:100%;background:var(--c,var(--g))}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.chk{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--mut);background:transparent;display:grid;place-items:center;margin-top:1px;padding:0}
.chk svg{width:18px;height:18px;opacity:0}
.task.ok .chk{background:var(--g);border-color:var(--g)}
.task.ok .chk svg{opacity:1}
.task.ok .tt{text-decoration:line-through;color:var(--mut)}
.tag{display:inline-block;font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:1px 7px;margin:0 4px 3px 0}
.tag.late{background:transparent;color:var(--fx);border:1px solid var(--fx)}
.tt{display:block;font-weight:500}
.hint{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.day{margin-bottom:12px}
.day h3{font-size:20px;display:flex;justify-content:space-between;gap:8px}
.day.hoje{border-color:var(--g);box-shadow:0 0 0 2px var(--g) inset}
.day.off{opacity:.6}
.wk{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.wk h2{font-size:22px;margin:0;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--g2);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:700;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:12px;font-weight:700;color:var(--mut);text-align:center;padding:4px 0}
.cal button{aspect-ratio:1/1.05;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-weight:700;font-size:15px}
.cal button.fora{visibility:hidden}
.cal button.hoje{border:2px solid var(--g)}
.cal button.sel{background:var(--g);color:#fff;border-color:var(--g)}
.cal button.prova{background:var(--fx);color:#fff;border-color:var(--fx)}
.cal button.feito .n::after{content:"✓";font-size:11px;margin-left:2px;color:var(--ct)}
.cal button.sel.feito .n::after{color:var(--sun)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.dots i.ok{opacity:.35}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--mut)}
.leg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}
.donut{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.donut .fig{position:relative;width:150px;height:150px}
.donut svg{width:150px;height:150px;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .c b{font:700 38px/1 "Barlow Condensed"}
.donut .c span{font-size:13px;color:var(--mut)}
.lg{display:grid;gap:10px}
.lg div{font-size:14px}
.lg b{display:flex;justify-content:space-between;gap:8px;font-weight:600}
@media(max-width:420px){.donut{grid-template-columns:1fr;justify-items:center}.lg{width:100%}}
.subj h3{font-size:22px;display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:0}
dt{color:var(--mut);font-size:14px;padding-top:2px}dd{margin:0;font-weight:600}
.dist{display:grid;gap:8px;margin-top:6px}
.dist div{display:grid;grid-template-columns:9.5em minmax(0,1fr) 2.5em;gap:10px;align-items:center;font-size:14px}
.dist i{display:block;height:14px;border-radius:4px;background:var(--c)}
.dist b{text-align:right}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.tl li:first-child{border-top:0}
.tl li b{white-space:nowrap}
.tl li.past{color:var(--mut)}
.tl li.big b,.tl li.big span{color:var(--fx);font-weight:700}
ul.dots-list{margin:0;padding-left:20px}
ul.dots-list li{margin:4px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-width:52px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700}
.chip[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}
label.f{display:block;margin-bottom:12px;font-size:14px;color:var(--mut)}
label.f input,label.f textarea{display:block;width:100%;margin-top:4px;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
textarea{min-height:90px}
.pausa{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs .wrap{display:grid}
.tabs button{background:none;border:0;min-height:58px;font-size:13px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current=true]{color:var(--g)}
:root[data-theme=dark] .tabs button[aria-current=true]{color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tabs button[aria-current=true]{color:var(--sun)}}
.alert{background:light-dark(#fff6d6,#3a3012);border:1px solid light-dark(#f0d77a,#6b5a1f);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
a{color:inherit}
.foot{text-align:center;font-size:12px;color:var(--mut);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const PAT = {1:['ct','pt'],2:['mt','ct'],3:['pt','ct'],4:['mt','ct'],5:['pt','mt'],6:['qs','rv'],0:['ct','qs']};
const FINAL = [
  ['2027-01-25','pt','Revisão final: concordância, regência, pontuação e pronomes + 20 questões'],
  ['2027-01-26','mt','Revisão final: porcentagem, regra de três, medidas, áreas e volumes + 20 questões'],
  ['2027-01-26','fx','Baixar o Cartão de Confirmação (CCI) no site da Cesgranrio e ver o local e o horário do portão'],
  ['2027-01-27','ct','Revisão final: resumos e flashcards da apostila e mapas'],
  ['2027-01-28','fx','Simulado completo: 60 questões em 4 horas (30 CT, 15 Português, 15 Matemática)'],
  ['2027-01-29','fx','Corrigir o simulado e revisar os erros'],
  ['2027-01-30','rv','Dia leve: revisão rápida de CT e separar documento original com foto, comprovante de inscrição e caneta azul ou preta de corpo transparente']
];
const TAGS = {pt:'Português',mt:'Matemática',ct:'Conh. Técnicos',qs:'Questões',rv:'Revisão',fx:'Reta final'};
const COR = m => MAT[m]?.cor || (m==='fx' ? 'var(--fx)' : 'var(--rv)');
const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DIASL = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

/* ---------- Estado ---------- */
const KEY = 'cronograma-estudos-v1';
const base = () => ({v:2, perfis:[{id:'beatriz',nome:'Beatriz',concursos:['ibge2027']}], extras:{}, prog:{}});
let S; try{S = JSON.parse(localStorage.getItem(KEY)) || base()}catch(e){S = base()}
const save = () => {try{localStorage.setItem(KEY, JSON.stringify(S))}catch(e){}};
let V = {view:'perfis', perfil:null, conc:null, tab:'hoje', semana:0, modo:'semana', mes:0, dia:null};
try{const l = JSON.parse(sessionStorage.getItem(KEY+'-v')); if(l) V = {...V, ...l}}catch(e){}

const P = (pid,cid) => {const k = pid+'|'+cid; if(!S.prog[k]) S.prog[k] = {done:{}, dias:[1,2,3,4,5,6], feriados:true, inicio:IBGE.inicio, pausas:[]}; if(!S.prog[k].pausas) S.prog[k].pausas = []; return S.prog[k]};
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => {const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d)};
const hoje = () => iso(new Date());
const addD = (s,n) => {const d = parse(s); d.setDate(d.getDate()+n); return iso(d)};
const fmt = s => {const d = parse(s); return DIAS[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const dm = s => s.slice(8)+'/'+s.slice(5,7);
const diasAte = s => Math.round((parse(s) - parse(hoje()))/864e5);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s[0].toUpperCase()+s.slice(1);

/* ---------- Gera o cronograma ---------- */
function plano(p){
  const ptr = {pt:0,mt:0,ct:0,qs:0}, rk = {pt:0,mt:0,ct:0,qs:0}, out = {};
  const next = m => {
    const M = MAT[m];
    if(ptr[m] < M.itens.length){const i = ptr[m]++; return {id:m+'-'+i, m, t:M.itens[i][0], g:M.itens[i][1]}}
    const k = rk[m]++; return {id:m+'-r'+k, m:m==='qs'?'qs':m, t:'Revisão: '+M.rev[k % M.rev.length], rev:1};
  };
  const fer = new Set(p.feriados ? IBGE.feriados : []);
  const pausado = d => p.pausas.some(x => d >= x.de && d <= x.ate);
  for(let d = p.inicio || IBGE.inicio; d <= IBGE.fimConteudo; d = addD(d,1)){
    const w = parse(d).getDay();
    if(!p.dias.includes(w) || fer.has(d) || pausado(d)) continue;
    out[d] = PAT[w].map(m => m === 'rv' ? {id:'rv-'+d, m:'rv', t:'Revisão da semana: refazer os erros e reler os resumos', rev:1} : next(m));
  }
  FINAL.forEach(([d,m,t],i) => (out[d] = out[d] || []).push({id:'fx-'+i, m, t}));
  out[IBGE.data] = [{id:'prova', m:'fx', t:'DIA DA PROVA: 13h, Catolé do Rocha. Chegue cedo!'}];
  return out;
}
const motivoFolga = (p,d) => p.pausas.some(x => d >= x.de && d <= x.ate) ? 'Pausa' : (p.feriados && IBGE.feriados.includes(d)) ? 'Feriado' : 'Folga';

/* ---------- Componentes ---------- */
const ICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const TOPO = '<svg class="topo" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#fff" stroke-width="1.4">'+
  [0,1,2,3,4,5,6,7].map(i => `<path d="M-20 ${30+i*22} C 60 ${10+i*22}, 120 ${70+i*20}, 200 ${40+i*22} S 340 ${i*24}, 420 ${50+i*20}"/>`).join('')+
  '<circle cx="330" cy="60" r="18"/><circle cx="330" cy="60" r="34"/><circle cx="330" cy="60" r="52"/></svg>';
const task = (t,done,late) => `<div class="task${done?' ok':''}"><button class="chk" data-t="${t.id}" aria-pressed="${!!done}" aria-label="Marcar como estudado">${ICK}</button><div><span class="tag" style="background:${COR(t.m)}">${TAGS[t.m]}</span>${late?`<span class="tag late">atrasada · ${late}</span>`:''}<span class="tt">${esc(t.t)}</span>${t.g?`<span class="hint">${esc(t.g)}</span>`:''}</div></div>`;
const concById = id => id === IBGE.id ? IBGE : S.extras[id];
const SUBJ = ['ct','pt','mt'];
const topicosEdital = c => c === IBGE ? SUBJ.flatMap(m => MAT[m].itens.map((_,i) => m+'-'+i)) : (c.topicos||[]).map(t => t.id);
const pct = (c,p) => {const ids = topicosEdital(c); return ids.length ? Math.round(100*ids.filter(i => p.done[i]).length/ids.length) : 0};
const porMat = p => SUBJ.map(m => {const n = MAT[m].itens.length, f = MAT[m].itens.filter((_,i) => p.done[m+'-'+i]).length; return {m, n, f}});

function header(c, p){
  const n = diasAte(c.data);
  const cont = n > 0 ? `<b>${n}</b><span>dias até a prova<br>${fmt(c.data)} · ${esc(c.hora||'')}</span>` : n === 0 ? `<b>Hoje!</b><span>Boa prova! ${esc(c.hora||'')}</span>` : `<b>✓</b><span>Prova realizada em ${fmt(c.data)}</span>`;
  const pc = pct(c,p);
  let bar;
  if(c === IBGE){const tot = topicosEdital(c).length; bar = porMat(p).map(x => `<i style="width:${100*x.f/tot}%;background:${MAT[x.m].cor}"></i>`).join('')}
  else bar = `<i style="width:${pc}%;background:var(--sun)"></i>`;
  return `<header class="top">${TOPO}<div class="wrap"><button class="back" data-go="concursos">‹ Meus concursos</button><small>${esc(c.cargo||'')}</small><h1>${esc(c.nome)}</h1><div class="count">${cont}</div><div class="bar" role="progressbar" aria-valuenow="${pc}" aria-label="Edital concluído">${bar}</div><small style="margin-top:6px">${pc}% do edital concluído</small></div></header>`;
}

function vHoje(c,p){
  const pl = plano(p), h = hoje(), dias = Object.keys(pl).sort();
  const ini = p.inicio || IBGE.inicio;
  let html = '';
  const prazo = IBGE.datas.find(([d,,big]) => d >= h && diasAte(d) <= 7 && !big);
  if(prazo) html += `<div class="alert"><b>${fmt(prazo[0])}:</b> ${esc(prazo[1])}.</div>`;
  const atras = dias.filter(d => d < h).flatMap(d => pl[d].map(t => ({...t, d}))).filter(t => !p.done[t.id]);
  if(h < ini){
    const d0 = dias[0];
    html += `<div class="alert">O cronograma começa ${DIASL[parse(d0).getDay()]}, <b>${dm(d0)}</b>. Até lá, dá para adiantar o primeiro dia.</div>`;
    html += `<section class="card"><h2>Primeiro dia · ${fmt(d0)}</h2>${pl[d0].map(t => task(t,p.done[t.id])).join('')}</section>`;
    return html;
  }
  const doDia = pl[h] || [];
  const lista = [...atras.map(t => task(t,false,dm(t.d))), ...doDia.map(t => task(t,p.done[t.id]))];
  if(lista.length){
    const feitos = doDia.filter(t => p.done[t.id]).length;
    const msg = !atras.length && doDia.length && feitos === doDia.length ? 'Tudo feito hoje. Mandou bem!' : atras.length ? `${atras.length} ${atras.length>1?'tarefas vieram':'tarefa veio'} de dias anteriores. Faça o que der; o resto segue para amanhã.` : 'Assista à aula do Gran do assunto e depois faça questões.';
    html += `<section class="card"><h2>${doDia.length ? 'Hoje' : 'Hoje é folga'} · ${fmt(h)}</h2><p class="muted" style="margin:-4px 0 6px">${msg}</p>${lista.join('')}</section>`;
  } else {
    const nx = dias.find(d => d > h);
    html += `<section class="card"><h2>${h > IBGE.data ? 'Prova feita!' : 'Hoje é folga'}</h2>${nx ? `<p class="muted">Próximo dia de estudo: <b>${fmt(nx)}</b></p>${pl[nx].map(t => task(t,p.done[t.id])).join('')}` : ''}</section>`;
  }
  return html;
}

function diaCard(d,pl,p,h){
  const ts = pl[d], w = parse(d).getDay();
  return `<section class="card day${d===h?' hoje':''}${ts?'':' off'}"><h3><span>${cap(DIASL[w])} · ${dm(d)}</span>${d===h?'<span class="muted">hoje</span>':''}</h3>${ts ? ts.map(t => task(t,p.done[t.id], (d < h && !p.done[t.id]) ? 'não feita' : '')).join('') : `<p class="muted" style="margin:6px 0 0">${motivoFolga(p,d)}</p>`}</section>`;
}

function vSemana(c,p){
  const pl = plano(p), h = hoje(), ini = p.inicio || IBGE.inicio;
  const base = h < ini ? ini : h;
  let html = `<div class="seg" role="group" aria-label="Visualização"><button data-modo="semana" aria-pressed="${V.modo==='semana'}">Semana</button><button data-modo="mes" aria-pressed="${V.modo==='mes'}">Mês</button></div>`;
  if(V.modo === 'mes'){
    const r = parse(base); r.setDate(1); r.setMonth(r.getMonth()+V.mes);
    const y = r.getFullYear(), mo = r.getMonth(), first = iso(r), off = r.getDay(), n = new Date(y,mo+1,0).getDate();
    html += `<div class="wk"><button class="btn alt sm" data-mes="-1" aria-label="Mês anterior">‹</button><h2>${cap(MESES[mo])} de ${y}</h2><button class="btn alt sm" data-mes="1" aria-label="Próximo mês">›</button></div>`;
    html += `<div class="card" style="padding:10px"><div class="cal">${DIAS.map(x => `<div class="h">${x}</div>`).join('')}${'<button class="fora" tabindex="-1" aria-hidden="true"></button>'.repeat(off)}`;
    for(let i = 0; i < n; i++){
      const d = addD(first,i), ts = pl[d] || [], ok = ts.length && ts.every(t => p.done[t.id]);
      const cls = [d===h?'hoje':'', d===V.dia?'sel':'', d===IBGE.data?'prova':'', ok?'feito':''].join(' ');
      html += `<button class="${cls}" data-dia-sel="${d}" aria-label="${fmt(d)}: ${ts.length} tarefas"><span class="n">${i+1}</span><span class="dots">${ts.map(t => `<i class="${p.done[t.id]?'ok':''}" style="--c:${COR(t.m)}"></i>`).join('')}</span></button>`;
    }
    html += `</div><div class="leg">${['pt','mt','ct','qs','rv','fx'].map(m => `<span style="--c:${COR(m)}">${TAGS[m]}</span>`).join('')}</div></div>`;
    if(V.dia && V.dia.slice(0,7) === first.slice(0,7)) html += diaCard(V.dia,pl,p,h);
    else html += `<p class="muted" style="text-align:center">Toque num dia para ver o que estudar.</p>`;
    return html;
  }
  const ref = parse(base); ref.setDate(ref.getDate() - ((ref.getDay()+6)%7) + V.semana*7);
  const seg = iso(ref), dias = [...Array(7)].map((_,i) => addD(seg,i));
  html += `<div class="wk"><button class="btn alt sm" data-sem="-1" aria-label="Semana anterior">‹ Anterior</button><h2>${dm(dias[0])} a ${dm(dias[6])}</h2><button class="btn alt sm" data-sem="1" aria-label="Próxima semana">Próxima ›</button></div>`;
  if(V.semana) html += `<p style="text-align:center;margin:-4px 0 12px"><button class="btn alt sm" data-sem="0">Voltar para esta semana</button></p>`;
  return html + dias.map(d => diaCard(d,pl,p,h)).join('');
}

function donut(p){
  const pm = porMat(p), tot = pm.reduce((a,x) => a+x.n, 0), feitos = pm.reduce((a,x) => a+x.f, 0);
  const R = 60, C = 2*Math.PI*R; let acc = 0;
  const segs = pm.map(x => {const len = C*x.f/tot, s = `<circle r="${R}" cx="75" cy="75" fill="none" stroke="${MAT[x.m].cor}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}"/>`; acc += len; return s}).join('');
  return `<section class="card"><h2>Andamento do edital</h2><div class="donut"><div class="fig"><svg viewBox="0 0 150 150" aria-hidden="true"><circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--rest)" stroke-width="18"/>${segs}</svg><div class="c"><b>${Math.round(100*feitos/tot)}%</b><span>concluído</span></div></div>
  <div class="lg">${pm.map(x => `<div style="--c:${MAT[x.m].cor}"><b><span>${MAT[x.m].nome}</span><span>${x.f}/${x.n}</span></b><div class="mini"><i style="width:${100*x.f/x.n}%"></i></div></div>`).join('')}<div class="muted">Faltam ${tot-feitos} de ${tot} assuntos.</div></div></div></section>`;
}

function vEdital(c,p){
  if(c !== IBGE){
    const ts = c.topicos||[];
    return `<section class="card"><h2>Conteúdo</h2>${ts.length ? ts.map(t => task({id:t.id,m:'rv',t:t.t},p.done[t.id])).join('').replace(/>Revisão<\/span>/g,'>Assunto</span>') : '<p class="muted">Nenhum assunto ainda.</p>'}
    <form id="addTop" class="row" style="margin-top:12px;align-items:flex-end"><label class="f" style="flex:1;margin:0">Novo assunto<input name="t" required></label><button class="btn">Adicionar</button></form></section>`;
  }
  return donut(p) + SUBJ.map(m => {
    const M = MAT[m], ids = M.itens.map((_,i) => m+'-'+i), f = ids.filter(i => p.done[i]).length;
    return `<section class="card subj" style="--c:${M.cor}"><h3><span>${M.nome}</span><span class="muted">${f}/${ids.length}</span></h3><div class="mini"><i style="width:${100*f/ids.length}%"></i></div>${M.itens.map((t,i) => task({id:m+'-'+i,m,t:t[0],g:t[1]},p.done[m+'-'+i])).join('')}</section>`;
  }).join('') + `<p class="muted">Português e Matemática seguem o Anexo III do edital; os itens marcados como "Base" ajudam em concordância, regência e pontuação. Conhecimentos Técnicos segue as seções da apostila e as 8 aulas do Gran.</p>`;
}

function vProva(c,p){
  const h = hoje();
  let html = `<section class="card"><h2>Informações da prova</h2><dl>
  <dt>Data</dt><dd>${fmt(c.data)}/${c.data.slice(0,4)}</dd>${c.hora?`<dt>Horário</dt><dd>${esc(c.hora)}</dd>`:''}
  ${c.cargo?`<dt>Cargo</dt><dd>${esc(c.cargo)}</dd>`:''}${c.nivel?`<dt>Nível</dt><dd>${esc(c.nivel)}</dd>`:''}
  ${c.area?`<dt>Área de trabalho</dt><dd>${esc(c.area)}</dd>`:''}${c.local?`<dt>Local de prova</dt><dd>${esc(c.local)}</dd>`:''}
  ${c.banca?`<dt>Banca</dt><dd>${esc(c.banca)}</dd>`:''}${c.extra?`<dt>Para</dt><dd>${esc(c.extra)}</dd>`:''}</dl>`;
  if(c === IBGE){
    html += `<p class="muted" style="margin-top:12px">O endereço exato e o horário do portão saem no Cartão de Confirmação (CCI), em 26/01.</p></section>
    <section class="card"><h2>Como é a prova</h2><p style="margin:0 0 8px">60 questões de múltipla escolha (A a E), todas com peso 1, em 4 horas.</p><div class="dist">${c.prova.map(([n,q,m]) => `<div><span>${n}</span><i style="--c:${MAT[m].cor};width:${q/30*100}%"></i><b>${q}</b></div>`).join('')}</div>
    <p style="margin:12px 0 0"><b>Para passar:</b> no mínimo 18 pontos (30%) no total <b>e</b> pelo menos 1 ponto em cada matéria.</p>
    <p class="muted" style="margin-top:8px">Conhecimentos Técnicos vale metade da prova, por isso aparece em quase todo dia do cronograma.</p></section>
    <section class="card"><h2>Datas importantes</h2><ul class="tl">${c.datas.map(([d,t,big]) => `<li class="${d<h?'past':''} ${big?'big':''}"><b>${dm(d)}/${d.slice(2,4)}</b><span>${esc(t)}</span></li>`).join('')}</ul></section>
    <section class="card"><h2>No dia da prova</h2><ul class="dots-list">
    <li>Levar documento <b>original com foto</b> (RG, CNH ou CNH digital no app oficial), comprovante de inscrição e <b>caneta azul ou preta de corpo transparente</b>.</li>
    <li>Proibido: lápis, lapiseira, borracha, corretor e calculadora.</li>
    <li>Só pode sair depois de <b>2 horas</b> de prova; o caderno de questões só pode ser levado na última hora.</li>
    <li>Não há segunda chamada.</li></ul></section>
    <section class="card"><h2>Links</h2><p style="margin:0 0 8px"><a href="https://www.cesgranrio.org.br" target="_blank" rel="noopener">Fundação Cesgranrio</a>: edital, apostila e cartão de confirmação</p><p style="margin:0"><a href="https://www.grancursosonline.com.br/aluno/curso/s/ibge-instituto-brasileiro-de-geografia-e-estatistica-temporario-recenseador-rec-pos-edital" target="_blank" rel="noopener">Curso no Gran</a>: videoaulas e caderno de questões</p></section>
    <section class="card"><h2>Meus dias de estudo</h2><p class="muted" style="margin:-4px 0 10px">Toque para ligar ou desligar. O cronograma se reorganiza sozinho, sem perder o que já foi marcado.</p>
    <div class="chips">${[1,2,3,4,5,6,0].map(w => `<button class="chip" data-dia="${w}" aria-pressed="${p.dias.includes(w)}">${DIAS[w]}</button>`).join('')}</div>
    <label class="row" style="margin-top:14px;gap:10px;min-height:44px"><input type="checkbox" id="fer" ${p.feriados?'checked':''} style="width:22px;height:22px"> Folga em 24, 25 e 31/12 e 1º/01</label>
    <label class="f" style="margin-top:6px">Começar em<input type="date" id="ini" value="${p.inicio||IBGE.inicio}" max="${IBGE.fimConteudo}"></label></section>
    <section class="card"><h2>Pausas</h2><p class="muted" style="margin:-4px 0 10px">Viagem, feriado da cidade, semana corrida… Os dias pausados ficam sem estudo e o conteúdo é empurrado para os dias seguintes.</p>
    ${p.pausas.map((x,i) => `<div class="pausa"><span>${dm(x.de)}${x.ate!==x.de?' a '+dm(x.ate):''}${x.nome?' · '+esc(x.nome):''}</span><button class="btn alt sm" data-rmp="${i}">Remover</button></div>`).join('')}
    <form id="addPausa" style="margin-top:10px"><div class="two"><label class="f">De<input type="date" name="de" required></label><label class="f">Até<input type="date" name="ate"></label></div><label class="f">Motivo (opcional)<input name="nome" placeholder="Ex.: viagem"></label><button class="btn sm">Adicionar pausa</button></form></section>`;
  } else {
    html += `<div class="row" style="margin-top:14px"><button class="btn alt sm" data-del="${c.id}">Remover concurso</button></div></section>`;
  }
  html += `<section class="card"><h2>Cópia de segurança</h2><p class="muted" style="margin:-4px 0 10px">O progresso fica salvo neste aparelho. De vez em quando, copie o código e guarde no WhatsApp ou nas Notas.</p>
  <div class="row"><button class="btn sm" id="bkp">Copiar código</button><button class="btn alt sm" id="rst">Restaurar</button></div>
  <div id="rstBox" hidden style="margin-top:12px"><label class="f">Cole o código aqui<textarea id="rstTxt"></textarea></label><button class="btn sm" id="rstOk">Restaurar progresso</button></div></section>
  <section class="card"><h2>Créditos</h2><ul class="dots-list muted">
  <li>Fontes Barlow e Barlow Condensed, de Jeremy Tribby, via Google Fonts (SIL Open Font License 1.1).</li>
  <li>Conteúdo baseado no Edital IBGE nº 03/2026 e na apostila "Conhecimentos básicos para o Censo Agropecuário, Florestal e Aquícola" (IBGE/ENCE), publicados pela Fundação Cesgranrio.</li>
  <li>Nomes das aulas citados como referência do curso Gran. Sem relação oficial com Gran, Cesgranrio ou IBGE.</li></ul>
  <p class="foot">Meu Cronograma de Estudo · v${VERSAO} · QyuDev</p></section>`;
  return html;
}

const TABS = [['hoje','Hoje','<path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="4"/>'],
  ['semana','Calendário','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
  ['edital','Edital','<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>'],
  ['prova','Prova','<path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>']];

function render(){
  try{sessionStorage.setItem(KEY+'-v', JSON.stringify(V))}catch(e){}
  const app = document.getElementById('app');
  const perfil = S.perfis.find(x => x.id === V.perfil);
  if(V.view === 'perfis' || !perfil){
    app.innerHTML = `<header class="top">${TOPO}<div class="wrap"><small>Meu Cronograma de Estudo</small><h1>Quem vai estudar?</h1></div></header>
    <main class="wrap">${S.perfis.map(x => `<button class="pick" data-perfil="${x.id}"><span class="av">${x.foto?`<img src="${x.foto}" alt="">`:esc(x.nome[0])}</span><strong>${esc(x.nome)}</strong></button>`).join('')}
    <form id="addPerfil" class="card"><h2>Novo perfil</h2><label class="f">Nome<input name="n" required maxlength="30"></label><button class="btn">Criar perfil</button></form><p class="foot">v${VERSAO}</p></main>`;
    return;
  }
  const conc = concById(V.conc);
  if(V.view === 'concursos' || !conc){
    app.innerHTML = `<header class="top">${TOPO}<div class="wrap"><button class="back" data-go="perfis">‹ Trocar perfil</button><div class="who"><button class="foto" id="fotoBtn" aria-label="Trocar foto">${perfil.foto?`<img src="${perfil.foto}" alt="">`:esc(perfil.nome[0])}</button><div><small>Olá,</small><h1>${esc(perfil.nome)}</h1><button class="fotobtn" id="fotoBtn2">${perfil.foto?'Trocar foto':'Adicionar foto'}</button>${perfil.foto?' <button class="fotobtn" id="fotoDel">Remover</button>':''}</div></div><input type="file" id="fotoIn" accept="image/*" hidden></div></header>
    <main class="wrap"><h2 style="font-size:26px;margin:4px 0 12px">Meus concursos</h2>
    ${perfil.concursos.map(concById).filter(Boolean).map(c => {const p = P(perfil.id,c.id), n = diasAte(c.data), pc = pct(c,p);
      return `<button class="pick conc" data-conc="${c.id}"><h3>${esc(c.nome)}</h3><div class="meta muted">${esc(c.cargo||'')} · ${fmt(c.data)}/${c.data.slice(0,4)} · ${n>0?`faltam ${n} dias`:n===0?'é hoje!':'prova realizada'}</div><div class="mini"><i style="width:${pc}%"></i></div><div class="muted" style="margin-top:6px">${pc}% do edital concluído</div></button>`}).join('')}
    <form id="addConc" class="card"><h2>Adicionar concurso</h2>
    <label class="f">Nome<input name="nome" required placeholder="Ex.: Prefeitura 2027"></label>
    <label class="f">Cargo<input name="cargo"></label><label class="f">Banca<input name="banca"></label>
    <div class="two"><label class="f">Data da prova<input name="data" type="date" required></label><label class="f">Horário<input name="hora" placeholder="Ex.: 8h às 12h"></label></div>
    <label class="f">Local de prova<input name="local"></label>
    <label class="f">Assuntos (um por linha)<textarea name="top"></textarea></label><button class="btn">Adicionar</button></form></main>`;
    return;
  }
  const p = P(perfil.id, conc.id);
  const tabs = conc === IBGE ? TABS : TABS.filter(t => t[0]==='edital'||t[0]==='prova');
  if(!tabs.some(t => t[0]===V.tab)) V.tab = tabs[0][0];
  const body = {hoje:vHoje, semana:vSemana, edital:vEdital, prova:vProva}[V.tab](conc,p);
  app.innerHTML = header(conc,p) + `<main class="wrap">${body}</main><nav class="tabs" aria-label="Seções"><div class="wrap" style="grid-template-columns:repeat(${tabs.length},minmax(0,1fr))">${tabs.map(([k,l,ic]) => `<button data-tab="${k}" aria-current="${V.tab===k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${l}</button>`).join('')}</div></nav>`;
}

function toast(m){const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200)}
const keep = () => {const y = scrollY; render(); scrollTo(0,y)};

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if(d.perfil){V = {...V, view:'concursos', perfil:d.perfil}; render(); scrollTo(0,0)}
  else if(d.go){V.view = d.go; render(); scrollTo(0,0)}
  else if(d.conc){V = {...V, view:'conc', conc:d.conc, tab:d.conc===IBGE.id?'hoje':'edital', semana:0, mes:0, dia:null}; render(); scrollTo(0,0)}
  else if(d.tab){V.tab = d.tab; V.semana = 0; V.mes = 0; render(); scrollTo(0,0)}
  else if(d.modo){V.modo = d.modo; V.dia = V.dia || hoje(); keep()}
  else if(d.sem !== undefined){V.semana = d.sem === '0' ? 0 : V.semana + Number(d.sem); keep()}
  else if(d.mes !== undefined){V.mes += Number(d.mes); keep()}
  else if(d.diaSel){V.dia = d.diaSel; keep()}
  else if(d.t){const p = P(V.perfil,V.conc); if(p.done[d.t]) delete p.done[d.t]; else {p.done[d.t] = hoje(); toast('Marcado como estudado')} save(); keep()}
  else if(d.dia !== undefined){const p = P(V.perfil,V.conc), w = Number(d.dia); p.dias = p.dias.includes(w) ? p.dias.filter(x => x!==w) : [...p.dias,w]; if(!p.dias.length) p.dias = [w]; save(); keep()}
  else if(d.rmp !== undefined){const p = P(V.perfil,V.conc); p.pausas.splice(Number(d.rmp),1); save(); toast('Pausa removida'); keep()}
  else if(d.del){if(b.dataset.sure){const pf = S.perfis.find(x => x.id===V.perfil); pf.concursos = pf.concursos.filter(x => x!==d.del); save(); V.view = 'concursos'; render()} else {b.dataset.sure = 1; b.textContent = 'Toque de novo para confirmar'}}
  else if(b.id === 'fotoBtn' || b.id === 'fotoBtn2'){document.getElementById('fotoIn').click()}
  else if(b.id === 'fotoDel'){delete S.perfis.find(x => x.id===V.perfil).foto; save(); render()}
  else if(b.id === 'bkp'){const code = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); navigator.clipboard.writeText(code).then(() => toast('Código copiado'), () => {document.getElementById('rstBox').hidden = false; const t = document.getElementById('rstTxt'); t.value = code; t.select(); toast('Copie o código selecionado')})}
  else if(b.id === 'rst'){document.getElementById('rstBox').hidden = false; document.getElementById('rstTxt').value = ''}
  else if(b.id === 'rstOk'){try{const n = JSON.parse(decodeURIComponent(escape(atob(document.getElementById('rstTxt').value.trim())))); if(!n.perfis) throw 0; S = n; save(); toast('Progresso restaurado'); render()}catch(err){toast('Código inválido')}}
});
document.addEventListener('change', e => {
  if(e.target.id === 'fotoIn' && e.target.files[0]){
    const img = new Image(), url = URL.createObjectURL(e.target.files[0]);
    img.onload = () => {const c = document.createElement('canvas'), z = 192; c.width = c.height = z; const s = Math.min(img.width,img.height);
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,z,z); URL.revokeObjectURL(url);
      S.perfis.find(x => x.id===V.perfil).foto = c.toDataURL('image/jpeg',.82); save(); toast('Foto salva neste aparelho'); render()};
    img.onerror = () => toast('Não deu para abrir essa imagem'); img.src = url; return;
  }
  const p = V.perfil && V.conc ? P(V.perfil,V.conc) : null; if(!p) return;
  if(e.target.id === 'fer'){p.feriados = e.target.checked; save(); keep()}
  if(e.target.id === 'ini' && e.target.value){p.inicio = e.target.value; save(); keep()}
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target, fd = new FormData(f);
  if(f.id === 'addPerfil'){const n = fd.get('n').trim(); if(!n) return; const id = 'p'+Date.now().toString(36); S.perfis.push({id, nome:n, concursos:['ibge2027']}); save(); render()}
  if(f.id === 'addConc'){const id = 'c'+Date.now().toString(36); S.extras[id] = {id, nome:fd.get('nome').trim(), cargo:fd.get('cargo').trim(), banca:fd.get('banca').trim(), data:fd.get('data'), hora:fd.get('hora').trim(), local:fd.get('local').trim(), topicos:String(fd.get('top')).split('\n').map(s => s.trim()).filter(Boolean).map((t,i) => ({id:id+'-'+i, t}))}; S.perfis.find(x => x.id===V.perfil).concursos.push(id); save(); toast('Concurso adicionado'); render()}
  if(f.id === 'addTop'){const c = S.extras[V.conc], t = fd.get('t').trim(); if(t){c.topicos.push({id:c.id+'-'+Date.now().toString(36), t}); save(); render()}}
  if(f.id === 'addPausa'){const p = P(V.perfil,V.conc); let de = fd.get('de'), ate = fd.get('ate') || de; if(ate < de) [de,ate] = [ate,de]; p.pausas.push({de, ate, nome:String(fd.get('nome')||'').trim()}); p.pausas.sort((a,b) => a.de < b.de ? -1 : 1); save(); toast('Pausa adicionada'); keep()}
});
render();
try{if('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai$|claudeusercontent\.com$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {})}catch(e){}
}
</script>
</body>
</html>
